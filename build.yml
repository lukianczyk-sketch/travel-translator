name: Build Android APK + iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --org com.rlforgeworks --project-name travel_translator --platforms android,ios

      - name: Patch permissions + app name
        run: python3 tools/patch_platforms.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: TravelTranslator-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iPhone IPA (unsigned, for Sideloadly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --org com.rlforgeworks --project-name travel_translator --platforms android,ios

      - name: Patch permissions + app name
        run: python3 tools/patch_platforms.py

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr TravelTranslator.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TravelTranslator-iPhone-IPA
          path: TravelTranslator.ipa
