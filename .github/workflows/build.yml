name: Build Android APK + iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --org com.rlforgeworks --project-name travel_translator --platforms android,ios

      - name: Ensure a permanent signing key exists (created once, then committed)
        shell: bash
        run: |
          if [ ! -f signing/release.jks ]; then
            mkdir -p signing
            keytool -genkeypair -v -keystore signing/release.jks -storepass traveltranslator -keypass traveltranslator \
              -alias travel -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Travel Translator, O=RL Forge Works, L=Tehachapi, S=CA, C=US"
            git config user.name "build-bot"
            git config user.email "build-bot@users.noreply.github.com"
            git add -f signing/release.jks
            git commit -qm "Add permanent release signing key [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
          fi

      - name: Patch permissions + app name
        run: python3 tools/patch_platforms.py

      - name: Accept Android SDK licenses (NDK auto-install)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 2>&1 | tee build.log

      - name: Record which plugins got registered
        if: always()
        shell: bash
        run: |
          { echo "== GeneratedPluginRegistrant =="; cat android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java 2>/dev/null || echo "(missing)";
            echo "== plugins ==";  cat .flutter-plugins-dependencies 2>/dev/null | head -c 3000; echo;
            echo "== pub deps (mlkit) =="; flutter pub deps --style=compact 2>/dev/null | grep -i "mlkit\|tts\|wakelock"; } > registrant.txt
          cat registrant.txt
          LOG_SRC=registrant.txt bash tools/publish_log.sh registrant

      - uses: actions/upload-artifact@v4
        with:
          name: TravelTranslator-Android-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish APK to the "latest" release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk TravelTranslator.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Travel Translator — latest build" --notes "Always the newest build. Tap TravelTranslator.apk on your Android phone to install." --latest
          gh release upload latest TravelTranslator.apk --clobber

      - name: Publish build log to repo (on failure)
        if: failure()
        shell: bash
        run: bash tools/publish_log.sh android

  ios:
    name: iPhone IPA (unsigned, for Sideloadly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --org com.rlforgeworks --project-name travel_translator --platforms android,ios

      - name: Patch permissions + app name
        run: python3 tools/patch_platforms.py

      - run: flutter pub get

      - name: Build iOS (unsigned)
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr TravelTranslator.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TravelTranslator-iPhone-IPA
          path: TravelTranslator.ipa

      - name: Publish IPA to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Travel Translator — latest build" --notes "Always the newest build. Tap TravelTranslator.apk on your Android phone to install." --latest
          gh release upload latest TravelTranslator.ipa --clobber

      - name: Publish build log to repo (on failure)
        if: failure()
        shell: bash
        run: bash tools/publish_log.sh ios
