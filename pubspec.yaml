name: travel_translator
description: Live two-way conversation translator that works offline.
publish_to: "none"
version: 0.11.5+40

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0
  record: ^6.0.0
  onnxruntime: ^1.4.1
  wakelock_plus: ^1.2.8
  whisper_ggml_plus:
    path: third_party/whisper_ggml_plus

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/silero_vad.onnx
