name: travel_translator
description: Live two-way conversation translator that works offline.
publish_to: "none"
version: 0.3.6+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  record: ^6.0.0
  flutter_tts: ^4.2.0
  onnxruntime: ^1.4.1
  whisper_ggml_plus: ^1.5.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
